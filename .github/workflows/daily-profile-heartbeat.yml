name: Daily profile heartbeat

on:
  schedule:
    - cron: "37 8 * * *"
      timezone: "Africa/Casablanca"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-profile-heartbeat
  cancel-in-progress: true

jobs:
  refresh-profile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the profile repository
        uses: actions/checkout@v6
        with:
          ref: master

      - name: Refresh the repository heartbeat
        shell: bash
        run: |
          python - <<'PY'
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          today = datetime.now(ZoneInfo("Africa/Casablanca")).date().isoformat()
          Path(".github/profile-heartbeat.txt").write_text(
              f"Automated profile maintenance: {today} (Africa/Casablanca)\n",
              encoding="utf-8",
          )
          PY

      - name: Generate repository-hosted profile metrics
        env:
          GH_TOKEN: ${{ github.token }}
          PROFILE_LOGIN: yazzy01
        run: python .github/scripts/generate_profile_metrics.py

      - name: Commit the daily refresh when the date changes
        shell: bash
        run: |
          git config user.name "Yassir Rzigui (automated)"
          git config user.email "178524226+yazzy01@users.noreply.github.com"
          git add .github/profile-heartbeat.txt assets/profile-metrics.svg

          if git diff --cached --quiet; then
            echo "Profile heartbeat is already current."
            exit 0
          fi

          git commit -m "chore: refresh automated profile heartbeat"
          git push origin HEAD:master
